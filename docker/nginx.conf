# Lands at /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes
# from inside http{} — so http-level directives (log_format, map) are legal
# here, and mime.types has already been loaded.

# JSON access log. Two proxies sit in front (cloudflared, then the project's
# web nginx), so log Cloudflare's own client header next to whatever real_ip
# managed to resolve.
log_format edge escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","cf_ip":"$http_cf_connecting_ip",'
  '"host":"$host","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
  '"ref":"$http_referer","ua":"$http_user_agent"}';

# One source of truth for caching. A map plus a single server-level add_header
# sidesteps nginx's inheritance footgun: an add_header inside any location
# silently drops every add_header inherited from the server block.
map $uri $cache_control {
    default       "public, max-age=0, must-revalidate";  # html and anything unlisted
    ~^/_astro/    "public, max-age=31536000, immutable"; # content-hashed by Astro
    ~^/fonts/     "public, max-age=2592000";             # 30d, stable filenames
    ~^/media/     "public, max-age=86400";               # 1d — stable names, but not hashed
    ~^/vendor/    "public, max-age=604800";              # 7d, pinned vendored lib
    ~^/favicon    "public, max-age=604800";
    ~^/i18n/      "public, max-age=0, must-revalidate";  # fetched at runtime by the lang toggle
    ~^/admin/     "no-store";                            # CMS shell and its config
    ~^/404\.html$ "no-store";
    ~^/healthz$   "no-store";
}

server {
    listen 8000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;   # nothing here legitimately accepts a body

    # Load-bearing behind the tunnel. The container listens on 8000 while the
    # public site is :443, and with absolute_redirect on (the default) nginx
    # builds Location from $host plus its own port — so /works/syrnik would
    # 301 to http://elkhovering.com:8000/works/syrnik/, dead for every visitor.
    # This governs the index module's trailing-slash redirect too, not just
    # explicit `return`s, so do not drop it because "only one case needs it".
    absolute_redirect       off;
    port_in_redirect        off;
    server_name_in_redirect off;

    # The only possible peer is the project's web nginx on the compose bridge.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    access_log /dev/stdout edge;

    # The document root is immutable — a redeploy is a new container — so
    # cached stat() results, negative ones included, can never go stale.
    open_file_cache          max=4000 inactive=1h;
    open_file_cache_valid    1h;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    sendfile   on;
    tcp_nopush on;

    gzip            on;
    gzip_vary       on;    # correct Vary for the Cloudflare cache in front of us
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;   # the default `off` skips gzip whenever a Via header is present
    # text/html is always gzipped and must not be listed (duplicate MIME warning).
    # png/woff/ico are already compressed and are deliberately absent.
    gzip_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf-binary;   # 3D-лось: meshopt рассчитан на то, что поверх ещё будет gzip

    add_header Cache-Control          $cache_control always;
    add_header X-Content-Type-Options nosniff        always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # .glb нет в стандартном mime.types — без этого он уходит как
    # application/octet-stream и не попадает под gzip. Тип задаётся здесь, а не
    # блоком types{} на уровне server: тот ЗАМЕНИЛ бы весь унаследованный список,
    # и сломались бы все остальные типы.
    location ~* \.glb$ {
        types {}
        default_type model/gltf-binary;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro emits directory-style routes: /works/syrnik/index.html.
    # $uri/index.html must come BEFORE $uri/, or the index module's
    # trailing-slash 301 wins and every extension-less URL takes an extra hop.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Without the 403 here, a directory with no index inherits the prefix map's
    # long max-age and pins a year-long immutable error in visitors' browsers.
    error_page 403 404 =404 /404.html;
    location = /404.html {
        internal;
    }
}
